<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Meu Horário de Aulas</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(160deg, #1d2671, #c33764);
    min-height: 100vh;
    color: #fff;
  }
  .wrap {
    max-width: 480px;
    margin: 0 auto;
    padding: 20px 16px 40px;
  }
  header {
    text-align: center;
    padding: 10px 0 20px;
  }
  header h1 {
    font-size: 1.7rem;
    margin: 0 0 4px;
    letter-spacing: 0.5px;
  }
  header .emoji {
    font-size: 2.4rem;
  }
  .day-selector {
    display: flex;
    justify-content: space-between;
    gap: 3px;
    margin-bottom: 18px;
    overflow-x: auto;
  }
  .day-btn {
    flex: 1;
    padding: 10px 0;
    text-align: center;
    border-radius: 10px;
    background: rgba(255,255,255,0.08);
    border: 2px solid transparent;
    font-size: 0.85rem;
    font-weight: 600;
    color: #ffd166;
    cursor: pointer;
    transition: all .15s ease;
  }
  .day-btn.active {
    background: #ffd166;
    color: #1a1a1a;
    border-color: #ffd166;
    transform: scale(1.05);
  }
  .add-box {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
  }
  .add-input {
    flex: 1;
    padding: 12px 14px;
    font-size: 0.95rem;
    border-radius: 12px;
    border: none;
    background: rgba(255,255,255,0.15);
    color: #fff;
    outline: none;
  }
  .add-input::placeholder { color: #ddd; }
  .add-btn {
    padding: 0 16px;
    font-size: 1.1rem;
    font-weight: 700;
    border: none;
    border-radius: 12px;
    background: #ffd166;
    color: #1a1a1a;
    cursor: pointer;
  }
  .progress-box {
    background: rgba(255,255,255,0.1);
    border-radius: 16px;
    padding: 14px 18px;
    margin-bottom: 20px;
  }
  .progress-text {
    font-size: 1.05rem;
    font-weight: 700;
  }
  .progress-bar-outer {
    background: rgba(255,255,255,0.2);
    border-radius: 20px;
    height: 12px;
    width: 100%;
    margin-top: 10px;
    overflow: hidden;
  }
  .progress-bar-inner {
    height: 100%;
    background: linear-gradient(90deg, #38ef7d, #11998e);
    width: 0%;
    border-radius: 20px;
    transition: width .3s ease;
  }
  .item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(255,255,255,0.1);
    border-radius: 16px;
    padding: 14px 16px;
    margin-bottom: 12px;
    transition: background .2s ease, transform .12s ease;
    user-select: none;
  }
  .item-left {
    display: flex;
    align-items: center;
    gap: 14px;
    flex: 1;
    cursor: pointer;
  }
  .checkbox {
    min-width: 32px;
    height: 32px;
    border-radius: 10px;
    border: 2.5px solid #38ef7d;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1rem;
    background: rgba(255,255,255,0.05);
    flex-shrink: 0;
  }
  .item.checked .checkbox {
    background: #38ef7d;
    border-color: #38ef7d;
    color: #063;
  }
  .item-label {
    font-size: 1.1rem;
    font-weight: 600;
    line-height: 1.3;
    word-break: break-word;
  }
  .item.checked .item-label {
    text-decoration: line-through;
    opacity: 0.6;
  }
  .delete-btn {
    background: none;
    border: none;
    color: rgba(255,255,255,0.4);
    font-size: 1.1rem;
    cursor: pointer;
    padding: 6px;
  }
  .delete-btn:hover { color: #ff6b6b; }
  .reset-btn {
    display: block;
    width: 100%;
    margin-top: 24px;
    padding: 14px;
    font-size: 1rem;
    font-weight: 700;
    color: #fff;
    background: rgba(255,255,255,0.15);
    border: none;
    border-radius: 14px;
    cursor: pointer;
  }
  .empty-msg {
    text-align: center;
    color: rgba(255,255,255,0.6);
    margin: 30px 0;
    font-size: 0.95rem;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="emoji">👨‍🏫</div>
    <h1>Horário de Aulas</h1>
  </header>

  <div class="day-selector" id="daySelector"></div>

  <div class="add-box">
    <input type="text" id="itemInput" class="add-input" placeholder="Ex: 07:30 - 1° Ano Mat">
    <button id="addBtn" class="add-btn">＋</button>
  </div>

  <div class="progress-box">
    <div class="progress-text" id="progressText">0 de 0 aulas concluídas</div>
    <div class="progress-bar-outer">
      <div class="progress-bar-inner" id="progressBar"></div>
    </div>
  </div>

  <div id="itemsList"></div>
  <div class="empty-msg" id="emptyMsg">Nenhuma aula cadastrada para este dia.</div>

  <button class="reset-btn" id="resetBtn">🔄 Desmarcar aulas do dia</button>
</div>

<script>
const defaultSchedule = {
  dom: [],
  seg: [
    { id: 1, label: "10:20 - 3° Mat" },
    { id: 2, label: "11:10 - 3° Mat" },
    { id: 3, label: "13:30 - 1° Mat" },
    { id: 4, label: "14:20 - 3° E.A." },
    { id: 5, label: "15:10 - 3° E.A." }
  ],
  ter: [
    { id: 1, label: "Adicionar horário de Terça..." }
  ],
  qua: [
    { id: 1, label: "09:10 - 3° E.A." },
    { id: 2, label: "10:20 - 2° E.A." },
    { id: 3, label: "13:30 - E.A." },
    { id: 4, label: "14:20 - E.A." },
    { id: 5, label: "15:10 - 3° Mat" }
  ],
  qui: [
    { id: 1, label: "08:20 - 1° Mat" },
    { id: 2, label: "09:10 - 1° Mat" },
    { id: 3, label: "10:20 - 3° E.A." },
    { id: 4, label: "11:10 - 2° E.A." },
    { id: 5, label: "13:00 - 3° Mat" },
    { id: 6, label: "13:50 - 3° Mat" }
  ],
  sex: [
    { id: 1, label: "Adicionar horário de Sexta..." }
  ],
  sab: []
};

const days = [
  { key: "dom", label: "Dom" },
  { key: "seg", label: "Seg" },
  { key: "ter", label: "Ter" },
  { key: "qua", label: "Qua" },
  { key: "qui", label: "Qui" },
  { key: "sex", label: "Sex" },
  { key: "sab", label: "Sáb" }
];

const todayIndex = new Date().getDay();
let selectedDay = days[todayIndex].key;
let allItems = {};
let checkedState = {};

const daySelectorEl = document.getElementById('daySelector');
const itemsListEl = document.getElementById('itemsList');
const progressTextEl = document.getElementById('progressText');
const progressBarEl = document.getElementById('progressBar');
const emptyMsgEl = document.getElementById('emptyMsg');
const resetBtn = document.getElementById('resetBtn');
const itemInput = document.getElementById('itemInput');
const addBtn = document.getElementById('addBtn');

function loadData() {
  try {
    const savedItems = localStorage.getItem('school_schedule_items');
    const savedChecked = localStorage.getItem('school_schedule_checked');
    
    allItems = savedItems ? JSON.parse(savedItems) : defaultSchedule;
    checkedState = savedChecked ? JSON.parse(savedChecked) : {};
  } catch (e) {
    allItems = defaultSchedule;
    checkedState = {};
  }
}

function saveData() {
  try {
    localStorage.setItem('school_schedule_items', JSON.stringify(allItems));
    localStorage.setItem('school_schedule_checked', JSON.stringify(checkedState));
  } catch (e) {}
}

function renderDaySelector() {
  daySelectorEl.innerHTML = '';
  days.forEach(d => {
    const btn = document.createElement('div');
    btn.className = 'day-btn' + (d.key === selectedDay ? ' active' : '');
    btn.textContent = d.label;
    btn.onclick = () => {
      selectedDay = d.key;
      renderDaySelector();
      renderItems();
    };
    daySelectorEl.appendChild(btn);
  });
}

function renderItems() {
  itemsListEl.innerHTML = '';
  const currentList = allItems[selectedDay] || [];
  
  if (currentList.length === 0) {
    emptyMsgEl.style.display = 'block';
  } else {
    emptyMsgEl.style.display = 'none';
  }

  currentList.forEach(item => {
    const checkKey = selectedDay + '_' + item.id;
    const checked = !!checkedState[checkKey];
    
    const el = document.createElement('div');
    el.className = 'item' + (checked ? ' checked' : '');
    el.innerHTML = `
      <div class="item-left">
        <div class="checkbox">${checked ? '✓' : ''}</div>
        <div class="item-label">${item.label}</div>
      </div>
      <button class="delete-btn" title="Excluir">🗑️</button>
    `;
    
    el.querySelector('.item-left').onclick = () => {
      checkedState[checkKey] = !checkedState[checkKey];
      renderItems();
      saveData();
    };
    
    el.querySelector('.delete-btn').onclick = (e) => {
      e.stopPropagation();
      allItems[selectedDay] = allItems[selectedDay].filter(i => i.id !== item.id);
      renderItems();
      saveData();
    };

    itemsListEl.appendChild(el);
  });
  updateProgress();
}

function updateProgress() {
  const currentList = allItems[selectedDay] || [];
  const total = currentList.length;
  const checkedCount = currentList.filter(i => checkedState[selectedDay + '_' + i.id]).length;
  
  progressTextEl.textContent = `${checkedCount} de ${total} aulas concluídas`;
  const percent = total > 0 ? (checkedCount / total) * 100 : 0;
  progressBarEl.style.width = percent + '%';
}

function addItem() {
  const text = itemInput.value.trim();
  if (!text) return;

  if (!allItems[selectedDay]) allItems[selectedDay] = [];
  
  allItems[selectedDay].push({
    id: Date.now(),
    label: text
  });

  itemInput.value = '';
  renderItems();
  saveData();
}

addBtn.onclick = addItem;
itemInput.onkeypress = (e) => { if (e.key === 'Enter') addItem(); };

resetBtn.onclick = () => {
  const currentList = allItems[selectedDay] || [];
  currentList.forEach(item => {
    delete checkedState[selectedDay + '_' + item.id];
  });
  renderItems();
  saveData();
};

loadData();
renderDaySelector();
renderItems();
</script>
</body>
</html>
