<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Meu Horário de Aulas</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icone.png">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(160deg, #1d2671, #c33764);
    min-height: 100vh;
    color: #fff;
  }
  .wrap {
    max-width: 480px;
    margin: 0 auto;
    padding: 20px 16px 40px;
  }
  header {
    text-align: center;
    padding: 10px 0 20px;
  }
  header h1 {
    font-size: 1.5rem;
    margin: 0;
    letter-spacing: 0.5px;
    color: #ffd166;
    font-weight: 700;
  }
  .day-selector {
    display: flex;
    justify-content: space-between;
    gap: 3px;
    margin-bottom: 18px;
    overflow-x: auto;
  }
  .day-btn {
    flex: 1;
    padding: 10px 0;
    text-align: center;
    border-radius: 10px;
    background: rgba(255,255,255,0.08);
    border: 2px solid transparent;
    font-size: 0.85rem;
    font-weight: 600;
    color: #ffd166;
    cursor: pointer;
    transition: all .15s ease;
  }
  .day-btn.active {
    background: #ffd166;
    color: #1a1a1a;
    border-color: #ffd166;
    transform: scale(1.05);
  }
  .progress-box {
    background: rgba(255,255,255,0.1);
    border-radius: 16px;
    padding: 14px 18px;
    margin-bottom: 20px;
  }
  .progress-text {
    font-size: 1.05rem;
    font-weight: 700;
  }
  .progress-bar-outer {
    background: rgba(255,255,255,0.2);
    border-radius: 20px;
    height: 12px;
    width: 100%;
    margin-top: 10px;
    overflow: hidden;
  }
  .progress-bar-inner {
    height: 100%;
    background: linear-gradient(90deg, #38ef7d, #11998e);
    width: 0%;
    border-radius: 20px;
    transition: width .3s ease;
  }
  /* Estilo da Linha de Almoço */
  .lunch-divider {
    text-align: center;
    background: rgba(0, 0, 0, 0.25);
    padding: 8px;
    border-radius: 12px;
    margin: 14px 0;
    font-size: 0.85rem;
    font-weight: 700;
    color: #ffd166;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .slot-card {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(255,255,255,0.08);
    border-radius: 16px;
    padding: 12px 16px;
    margin-bottom: 10px;
    border: 2px solid transparent;
    transition: all 0.2s;
  }
  .slot-card.has-class {
    background: rgba(255,255,255,0.15);
  }
  .slot-card.current-class {
    background: rgba(255, 209, 102, 0.25);
    border-color: #ffd166;
  }
  .slot-time {
    font-size: 0.9rem;
    font-weight: 700;
    color: #ffd166;
    min-width: 85px;
  }
  .slot-info {
    flex: 1;
    font-size: 1.05rem;
    font-weight: 600;
    padding: 0 10px;
  }
  .slot-free {
    color: rgba(255,255,255,0.35);
    font-style: italic;
    font-weight: 400;
  }
  .slot-card.checked {
    background: rgba(56, 239, 125, 0.15);
    border-color: rgba(56, 239, 125, 0.5);
  }
  .slot-card.checked .slot-info {
    text-decoration: line-through;
    opacity: 0.6;
  }
  .checkbox {
    min-width: 30px;
    height: 30px;
    border-radius: 8px;
    border: 2px solid #38ef7d;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1rem;
    background: rgba(255,255,255,0.05);
    cursor: pointer;
  }
  .slot-card.checked .checkbox {
    background: #38ef7d;
    border-color: #38ef7d;
    color: #063;
  }
  .reset-btn {
    display: block;
    width: 100%;
    margin-top: 24px;
    padding: 14px;
    font-size: 1rem;
    font-weight: 700;
    color: #fff;
    background: rgba(255,255,255,0.15);
    border: none;
    border-radius: 14px;
    cursor: pointer;
  }
  .current-badge {
    font-size: 0.7rem;
    background: #ffd166;
    color: #1a1a1a;
    padding: 2px 6px;
    border-radius: 4px;
    font-weight: 700;
    display: inline-block;
    margin-bottom: 2px;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="currentDateTitle">Carregando data...</h1>
  </header>

  <div class="day-selector" id="daySelector"></div>

  <div class="progress-box">
    <div class="progress-text" id="progressText">0 de 0 aulas dadas</div>
    <div class="progress-bar-outer">
      <div class="progress-bar-inner" id="progressBar"></div>
    </div>
  </div>

  <div id="slotsList"></div>

  <button class="reset-btn" id="resetBtn">🔄 Limpar marcações manuais</button>
</div>

<script>
// Grade de horários com os blocos da manhã e da tarde
const scheduleSlots = {
  seg: [
    { time: "07:30 - 08:20", label: "", period: "mora" },
    { time: "08:20 - 09:10", label: "", period: "mora" },
    { time: "09:10 - 10:00", label: "", period: "mora" },
    { time: "10:20 - 11:10", label: "3° Matemática", period: "mora" },
    { time: "11:10 - 12:00", label: "3° Matemática", period: "mora" },
    { type: "lunch" },
    { time: "13:30 - 14:20", label: "1° Matemática", period: "tarde" },
    { time: "14:20 - 15:10", label: "3° Est.Av.", period: "tarde" },
    { time: "15:10 - 16:00", label: "3° Est.Av.", period: "tarde" }
  ],
  ter: [
    { time: "07:30 - 08:20", label: "1° Química", period: "mora" },
    { time: "08:20 - 09:10", label: "2° Info", period: "mora" },
    { time: "09:10 - 10:00", label: "2° Info", period: "mora" },
    { time: "10:20 - 11:10", label: "3° ADM", period: "mora" },
    { time: "11:10 - 12:00", label: "3° ADM", period: "mora" },
    { type: "lunch" },
    { time: "13:30 - 14:20", label: "", period: "tarde" },
    { time: "14:20 - 15:10", label: "", period: "tarde" },
    { time: "15:10 - 16:00", label: "", period: "tarde" }
  ],
  qua: [
    { time: "07:30 - 08:20", label: "", period: "mora" },
    { time: "08:20 - 09:10", label: "", period: "mora" },
    { time: "09:10 - 10:00", label: "3° Est.Av.", period: "mora" },
    { time: "10:20 - 11:10", label: "2° Est.Av.", period: "mora" },
    { time: "11:10 - 12:00", label: "", period: "mora" },
    { type: "lunch" },
    { time: "13:30 - 14:20", label: "3° Est.Av.", period: "tarde" },
    { time: "14:20 - 15:10", label: "3° Est.Av.", period: "tarde" },
    { time: "15:10 - 16:00", label: "3° Matemática", period: "tarde" }
  ],
  qui: [
    { time: "07:30 - 08:20", label: "", period: "mora" },
    { time: "08:20 - 09:10", label: "1° Matemática", period: "mora" },
    { time: "09:10 - 10:00", label: "1° Matemática", period: "mora" },
    { time: "10:20 - 11:10", label: "3° Est.Av.", period: "mora" },
    { time: "11:10 - 12:00", label: "2° Est.Av.", period: "mora" },
    { type: "lunch" },
    { time: "13:00 - 13:50", label: "3° Matemática", period: "tarde" },
    { time: "13:50 - 14:40", label: "3° Matemática", period: "tarde" }
  ],
  sex: [
    { time: "07:30 - 08:20", label: "2° Info", period: "mora" },
    { time: "08:20 - 09:10", label: "1° Quimica", period: "mora" },
    { time: "09:10 - 10:00", label: "3° ADM", period: "mora" },
    { time: "10:20 - 11:10", label: "1° Química", period: "mora" },
    { time: "11:10 - 12:00", label: "3° ADM", period: "mora" },
    { type: "lunch" },
    { time: "13:30 - 14:20", label: "", period: "tarde" },
    { time: "14:20 - 15:10", label: "", period: "tarde" },
    { time: "15:10 - 16:00", label: "", period: "tarde" }
  ],
};

const days = [
  { key: "dom", label: "Dom" },
  { key: "seg", label: "Seg" },
  { key: "ter", label: "Ter" },
  { key: "qua", label: "Qua" },
  { key: "qui", label: "Qui" },
  { key: "sex", label: "Sex" },
  { key: "sab", label: "Sáb" }
];

const now = new Date();
const todayIndex = now.getDay();
let selectedDay = days[todayIndex].key;
let manualOverrides = {}; 

const daySelectorEl = document.getElementById('daySelector');
const slotsListEl = document.getElementById('slotsList');
const progressTextEl = document.getElementById('progressText');
const progressBarEl = document.getElementById('progressBar');
const resetBtn = document.getElementById('resetBtn');
const currentDateTitleEl = document.getElementById('currentDateTitle');

function updateHeaderDate() {
  const options = { weekday: 'long', day: 'numeric', month: 'long' };
  let formattedDate = now.toLocaleDateString('pt-BR', options);
  formattedDate = formattedDate.charAt(0).toUpperCase() + formattedDate.slice(1);
  currentDateTitleEl.textContent = formattedDate;
}

function loadData() {
  try {
    const saved = localStorage.getItem('grade_overrides_v2');
    manualOverrides = saved ? JSON.parse(saved) : {};
  } catch (e) {
    manualOverrides = {};
  }
}

function saveData() {
  try {
    localStorage.setItem('grade_overrides_v2', JSON.stringify(manualOverrides));
  } catch (e) {}
}

function renderDaySelector() {
  daySelectorEl.innerHTML = '';
  // Exibe apenas de Segunda a Sexta-feira na barra de seleção
  const weekdays = days.filter(d => d.key !== 'dom' && d.key !== 'sab');
  weekdays.forEach(d => {
    const btn = document.createElement('div');
    btn.className = 'day-btn' + (d.key === selectedDay ? ' active' : '');
    btn.textContent = d.label;
    btn.onclick = () => {
      selectedDay = d.key;
      renderDaySelector();
      renderSlots();
    };
    daySelectorEl.appendChild(btn);
  });
}

function timeToMins(timeStr) {
  const parts = timeStr.split(':');
  return parseInt(parts[0]) * 60 + parseInt(parts[1]);
}

function renderSlots() {
  slotsListEl.innerHTML = '';
  const currentSlots = scheduleSlots[selectedDay] || [];
  
  const isToday = (selectedDay === days[todayIndex].key);
  const currentMins = now.getHours() * 60 + now.getMinutes();

  let totalClasses = currentSlots.filter(s => s.type !== 'lunch' && s.label.trim() !== "").length;
  let checkedClasses = 0;

  currentSlots.forEach((slot, index) => {
    if (slot.type === 'lunch') {
      const divider = document.createElement('div');
      divider.className = 'lunch-divider';
      divider.textContent = '🍽️ Intervalo / Almoço';
      slotsListEl.appendChild(divider);
      return;
    }

    const hasClass = slot.label.trim() !== "";
    const checkKey = selectedDay + '_' + index;
    
    const startTimeStr = slot.time.split(' - ')[0];
    const startMins = timeToMins(startTimeStr);
    const isPastTime = isToday && (currentMins >= startMins + 50);

    let checked = false;
    if (manualOverrides[checkKey] !== undefined) {
      checked = manualOverrides[checkKey];
    } else if (isPastTime) {
      checked = true;
    }

    if (hasClass && checked) checkedClasses++;

    let isCurrent = false;
    if (isToday && hasClass) {
      if (currentMins >= startMins && currentMins < startMins + 50) {
        isCurrent = true;
      }
    }

    const card = document.createElement('div');
    card.className = 'slot-card' + (hasClass ? ' has-class' : '') + (checked ? ' checked' : '') + (isCurrent ? ' current-class' : '');

    card.innerHTML = `
      <div class="slot-time">${startTimeStr}</div>
      <div class="slot-info">
        ${isCurrent ? '<div class="current-badge">⚡ ACONTECENDO AGORA</div>' : ''}
        ${hasClass ? slot.label : '<span class="slot-free">Livre / Vago</span>'}
      </div>
      ${hasClass ? `<div class="checkbox">${checked ? '✓' : ''}</div>` : '<div style="width:30px"></div>'}
    `;

    if (hasClass) {
      card.onclick = () => {
        manualOverrides[checkKey] = !checked;
        renderSlots();
        saveData();
      };
    }

    slotsListEl.appendChild(card);
  });

  progressTextEl.textContent = `${checkedClasses} de ${totalClasses} aulas dadas`;
  const percent = totalClasses > 0 ? (checkedClasses / totalClasses) * 100 : 0;
  progressBarEl.style.width = percent + '%';
}

resetBtn.onclick = () => {
  manualOverrides = {};
  renderSlots();
  saveData();
};

updateHeaderDate();
loadData();
renderDaySelector();
renderSlots();
</script>
</body>
</html>
